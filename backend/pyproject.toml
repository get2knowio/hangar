[project]
name = "hangar"
description = "Hangar — self-hosted fleet control plane (provider-agnostic core)"
# Floor and ceiling are both exercised by CI (see .github/workflows/ci.yml's
# python-version matrix). Do not widen this range without adding the interpreter
# to that matrix — an unexercised claim is a claim nobody is keeping.
requires-python = ">=3.12,<3.15"
# Derived from git tags by hatch-vcs; never a hand-bumped literal. Off-tag builds
# get a local version (0.3.12.dev1+g<sha>) that PyPI/registries structurally reject.
dynamic = ["version"]
dependencies = [
    "fastapi>=0.141.1",
    "uvicorn[standard]>=0.52.1",
    "pydantic>=2.8",
    "pydantic-settings>=2.15.0",
    "sqlalchemy[asyncio]>=2.0.52",
    "alembic>=1.19.1",
    "aiosqlite>=0.20",
    "githubkit[auth-app]>=0.16.0",
    "apscheduler>=3.10",
    "cryptography>=50.0.0",
    "structlog>=24.4",
    "httpx>=0.27",
    "authlib>=1.3",
    "itsdangerous>=2.2",
]

# Extras are for what a CONSUMER installs. Dev tooling lives in
# [dependency-groups] below and never leaks into an install of the app.
[project.optional-dependencies]
postgres = ["asyncpg>=0.29"]

# PEP 735 groups. `uv sync` installs `dev` by default; CI installs it explicitly
# alongside --all-extras so mypy sees every optional import (a green mypy run over
# a half-installed environment looks like evidence while checking nothing).
[dependency-groups]
test = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "pytest-cov>=6.0",
    "pytest-timeout>=2.3",
    "pyyaml>=6.0",  # tests/unit/test_toolchain_consistency.py reads the CI workflow
    "respx>=0.21",
]
lint = [
    "ruff>=0.16.3",
    "mypy>=2.3.0",
]
dev = [
    { include-group = "test" },
    { include-group = "lint" },
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"
# The package lives in backend/ but the tags live on the repo root's .git;
# setuptools_scm does not search parent directories on its own.
raw-options = { root = ".." }

[tool.hatch.build.targets.wheel]
packages = ["src/hangar"]

[tool.uv]
# Resolver-side twin of the Dependabot cooldown in .github/dependabot.yml: a
# freshly published release ages before a plain `uv sync` can pull it in.
exclude-newer = "7 days"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
# --strict-markers turns a typo'd marker into a failure rather than a silently
# never-run test; --timeout turns a hung async test into a red build rather than
# a six-hour runner.
addopts = ["--strict-markers", "--strict-config", "--timeout=30"]
timeout = 30
markers = [
    "slow: test that takes materially longer than the rest of the suite",
    "integration: exercises more than one layer (api/services/persistence) together",
]

[tool.coverage.run]
source = ["hangar"]
branch = true

[tool.coverage.report]
# Ratchet only: raise this as coverage rises, never lower it to make a build green.
# Set to the lowest number measured ACROSS THE CI MATRIX, not the best one: the
# suite covers 87% on 3.14 but 80% on 3.12 (the divergence is concentrated in
# services/sync.py and services/webhooks.py). A floor only one leg can meet is a
# floor that gets deleted the first time the other leg goes red.
fail_under = 80
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
# Explicit selection, not ruff's default set — the default set changes between
# ruff releases, which would turn main red the day a new rule ships.
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "SIM", "ASYNC"]
# B008: FastAPI's Depends()/Query() in argument defaults is the framework idiom.
ignore = ["B008"]

[tool.ruff.lint.isort]
required-imports = ["from __future__ import annotations"]

[tool.mypy]
python_version = "3.12"
packages = ["hangar"]
mypy_path = "src"
plugins = ["pydantic.mypy"]
warn_unused_ignores = true
disallow_untyped_defs = true
ignore_missing_imports = true
