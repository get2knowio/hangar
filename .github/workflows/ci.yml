name: CI

# Every gate lives in mise.toml, never inline here. CI's steps are the same two
# verbs a contributor runs locally (`mise run setup`, `mise run check`), so the
# two cannot drift. To change what CI checks, change mise.toml.

on:
  push:
    branches: ["**"]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Least-privilege default for GITHUB_TOKEN; CI only needs to read the checkout.
permissions:
  contents: read

jobs:
  # Interpreter matrix. The name carries a version, so this job is deliberately
  # NOT a required status check — the version-free `Backend` gate below is, and
  # it cannot go green unless every leg here passed. Keeping required-check names
  # free of version numbers means a runtime bump never blocks every open PR.
  backend-matrix:
    name: Backend py${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The floor and the ceiling of `requires-python` in backend/pyproject.toml.
        # Adding an interpreter here and widening that range go together.
        python-version: ["3.12", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # hatch-vcs derives the version from tag history; a shallow clone on a
          # branch silently produces a plausible-but-wrong base version.
          fetch-depth: 0

      - name: Install toolchain (mise)
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        env:
          # Overrides the `python` pin in mise.toml for this matrix leg only.
          MISE_PYTHON_VERSION: ${{ matrix.python-version }}

      - name: Setup
        run: mise run backend:setup
        env:
          MISE_PYTHON_VERSION: ${{ matrix.python-version }}

      - name: Check
        # Format, lint, types, and tests with the coverage floor — all of it
        # defined in mise.toml.
        run: mise run backend:check
        env:
          MISE_PYTHON_VERSION: ${{ matrix.python-version }}

  # Stable, version-free gate. This is the name to protect the branch on.
  backend:
    name: Backend
    runs-on: ubuntu-latest
    needs: [backend-matrix]
    if: always()
    steps:
      - name: Require every interpreter leg to have passed
        run: |
          result='${{ needs.backend-matrix.result }}'
          echo "backend-matrix result: $result"
          [ "$result" = "success" ] || exit 1

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install toolchain (mise)
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Setup
        run: mise run frontend:setup

      - name: Check
        run: mise run frontend:check
