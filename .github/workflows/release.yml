name: Release

# Build and publish the Hangar container image to GHCR when a version tag is
# pushed (e.g. `v0.1.0`) or a GitHub Release is published. No image is built or
# published on ordinary pushes/PRs — that stays in ci.yml.
#
# Shape (portfolio standard): triggered by a pushed `v*` tag, a test job gates
# the publish, and a GitHub Release is created with generated notes and
# pre-release detection driven off the tag suffix.

on:
  push:
    tags:
      - "v*"
  release:
    types: [published]

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Least-privilege default; jobs that need more request it explicitly.
permissions:
  contents: read

jobs:
  # Classify the tag once so the `latest` image tag and the GitHub Release agree
  # on what a pre-release is.
  tag:
    name: Classify tag
    runs-on: ubuntu-latest
    outputs:
      prerelease: ${{ steps.classify.outputs.prerelease }}
    steps:
      - name: Detect pre-release suffix
        id: classify
        env:
          TAG: ${{ github.ref_name }}
        run: |
          # Matches PEP 440 canonical (v0.9.0rc1) and dashed (v0.9.0-rc1) forms,
          # anchored on a trailing digit. A bare substring test would misclassify
          # any tag that merely contains "rc"; matching only the dashed form would
          # publish a canonical v0.9.0rc1 as a stable release.
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-?(a|b|c|rc|alpha|beta|pre|preview|dev)\.?[0-9]+$ ]]; then
            prerelease=true
          else
            prerelease=false
          fi
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "::notice::tag=$TAG prerelease=$prerelease"

  # The publish is gated on the same `check` verb CI runs — a tag never ships
  # something the gates would have rejected.
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # hatch-vcs needs tag history

      - name: Install toolchain (mise)
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Setup
        run: mise run setup

      - name: Check
        run: mise run check

  image:
    name: Build & publish image (GHCR)
    runs-on: ubuntu-latest
    needs: [tag, test]
    permissions:
      contents: read
      packages: write # push to ghcr.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The image build derives the backend version from tag history via
          # hatch-vcs (see deploy/Dockerfile's backend-build stage).
          fetch-depth: 0

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags & labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          # ghcr.io/<owner>/<repo>, lowercased automatically.
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            # Only a stable release becomes :latest — driven by the shared
            # classification above, not a substring test on the tag.
            type=raw,value=latest,enable=${{ needs.tag.outputs.prerelease == 'false' }}

      - name: Build & push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          # Build context is the repo root so the Dockerfile can reach backend/ and frontend/.
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [tag, image]
    # Only when the tag push drove this run. A release published from the UI is
    # already the release — recreating it would fail.
    if: github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Create release with generated notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          PRERELEASE: ${{ needs.tag.outputs.prerelease }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::notice::Release $TAG already exists — nothing to create."
            exit 0
          fi
          args=(--generate-notes --title "$TAG")
          if [ "$PRERELEASE" = "true" ]; then
            args+=(--prerelease)
          fi
          gh release create "$TAG" "${args[@]}"
